services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: elive_events_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
    depends_on:
      - postgres
      - redis
    networks:
      - elive_events_network

  nginx:
    image: nginx:alpine
    container_name: elive_events_nginx
    restart: unless-stopped
    ports:
      - "8005:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - elive_events_network

  postgres:
    image: postgres:16
    container_name: elive_events_postgres
    restart: unless-stopped
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: elive_events
      POSTGRES_USER: elive_user
      POSTGRES_PASSWORD: elive_password
    volumes:
      - elive_events_postgres_data:/var/lib/postgresql/data
    networks:
      - elive_events_network

  redis:
    image: redis:7-alpine
    container_name: elive_events_redis
    restart: unless-stopped
    ports:
      - "6381:6379"
    networks:
      - elive_events_network

  pgadmin:
    image: dpage/pgadmin4
    container_name: elive_events_pgadmin
    restart: unless-stopped
    ports:
      - "5055:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@elive.co.tz
      PGADMIN_DEFAULT_PASSWORD: admin123
    depends_on:
      - postgres
    networks:
      - elive_events_network

  mailpit:
    image: axllent/mailpit
    container_name: elive_events_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - elive_events_network

volumes:
  elive_events_postgres_data:

networks:
  elive_events_network:
    driver: bridge