# Use the application's stricter policy when provided by PHP; otherwise
# retain the site-wide default for static assets and other responses.
map $upstream_http_referrer_policy $effective_referrer_policy {
    default $upstream_http_referrer_policy;
    ""      "strict-origin-when-cross-origin";
}

server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php index.html;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy $effective_referrer_policy always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy-Report-Only "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;

    client_max_body_size 100M;
    client_body_timeout 300s;
    client_header_timeout 300s;
    send_timeout 300s;

    location ^~ /storage/ {
        alias /var/www/html/storage/app/public/;
        access_log off;
        expires 30d;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /livewire/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;

        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_hide_header X-Powered-By;
        fastcgi_hide_header Referrer-Policy;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;

        fastcgi_connect_timeout 300s;
        fastcgi_send_timeout 300s;
        fastcgi_read_timeout 300s;

        fastcgi_request_buffering off;

        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
        fastcgi_busy_buffers_size 64k;
        fastcgi_temp_file_write_size 64k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~ /\.ht {
        deny all;
    }
}