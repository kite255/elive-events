name: Finance validation

on:
  pull_request:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finance:
    name: PHP lint and Laravel tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Africa/Dar_es_Salaam
      APP_TIMEZONE: Africa/Dar_es_Salaam
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, intl, gd, zip, bcmath
          coverage: none
          tools: composer:v2
      - name: Install ticket rendering system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          test -x /usr/bin/rsvg-convert
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare Laravel test environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Check finance PHP syntax
        run: |
          find app/Services app/Filament/Resources/Payouts app/Filament/Widgets tests/Unit tests/Feature -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Finance calculator unit tests
        run: php artisan test --filter=FinanceBalanceCalculatorTest
      - name: Payout authorization and settlement guard tests
        run: php artisan test --filter='PayoutReviewAuthorizationTest|PayoutRequestSettlementGuardTest'
      - name: Laravel test suite
        run: php artisan test

  postgres:
    name: PostgreSQL migration and payout checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: elive_test
          POSTGRES_USER: elive
          POSTGRES_PASSWORD: elive_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U elive -d elive_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: elive_test
      DB_USERNAME: elive
      DB_PASSWORD: elive_test_password
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP with PostgreSQL
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_pgsql, pgsql, intl, gd, zip, bcmath, pcntl
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Validate migrations on PostgreSQL
        run: php artisan migrate --force
      - name: Run finance integration tests on PostgreSQL
        run: php artisan test --filter='FinanceVisibilityTest|PayoutAuditTest|EventFinanceClearanceTest|ReconciledPayoutRequestTest|PayoutReviewAuthorizationTest|PayoutRequestSettlementGuardTest'
      - name: Test concurrent payout reservations on PostgreSQL
        run: php artisan test --filter=PostgreSqlConcurrentPayoutTest
