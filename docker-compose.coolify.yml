services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - elive_storage:/var/www/html/storage
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /var/www/html
    command: >
      php artisan queue:work redis
      --queue=communications,default
      --sleep=3
      --tries=3
      --timeout=120
    volumes:
      - elive_storage:/var/www/html/storage
    depends_on:
      - postgres
      - redis

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    restart: unless-stopped
    depends_on:
      - app
    volumes:
      - elive_storage:/var/www/html/storage:ro
    expose:
      - "80"

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: elive_events
      POSTGRES_USER: elive_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - elive_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  elive_postgres_data:
  elive_storage: